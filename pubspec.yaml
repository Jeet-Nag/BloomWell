name: bloomwell
description: "BloomWell - PCOD-Aware Offline Fitness & Wellness Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  fl_chart: ^1.1.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  timezone: ^0.10.1
  pedometer: ^4.2.0
  youtube_player_flutter: ^9.1.3
  video_player: ^2.14.1
  local_auth: ^3.0.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
